
name: E2E Selenium Test Suite CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install backend dependencies if available
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

          # Install testing dependencies
          pip install selenium pytest openpyxl webdriver-manager

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome Installation
        run: |
          google-chrome --version

      - name: Seed Database
        run: python backend/seed.py

      - name: Start Backend Server
        run: |
          python backend/main.py &
          sleep 10

      - name: Run PyTest Tests
        run: |
          pytest test_suite.py -v

      - name: Run Selenium E2E Tests
        run: |
          python selenium_e2e_tests.py

      - name: Generate Test Report
        if: always()
        run: |
          if [ -f generate_test_report.py ]; then
            python generate_test_report.py
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Test-Report
          path: E2E_Test_Report_VirtualTryOn.xlsx
          if-no-files-found: warn

