name: virtual_tryon_ai
description: AI-Based Virtual Try-On Application for Online Shopping
publish_to: 'none'
version: 1.0.0+1

# ─── SDK Constraints ──────────────────────────────────────────
environment:
  sdk: '>=3.0.0 <4.0.0'

# ─── Dependencies ─────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP & Networking
  http: ^1.2.1
  http_parser: ^4.0.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Camera & Image Picker
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  image_cropper: ^7.0.2

  # UI & Animations
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Navigation
  go_router: ^13.2.1

  # Utils
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0

# ─── Dev Dependencies ─────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

# ─── Flutter Configuration ─────────────────────────────────────
flutter:
  uses-material-design: true

  # Asset Declarations
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
